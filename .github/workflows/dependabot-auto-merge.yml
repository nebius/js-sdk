name: Approve and auto-merge Dependabot PRs

on:
  pull_request_target:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Do not check out PR code: this workflow has write permissions.
      - name: Approve PR
        run: gh pr review "$PR_URL" --approve

      # Enable auto-merge and Actions PR approvals in repository settings.
      # Configure required status checks on main to gate merging on CI.
      - name: Enable auto-merge
        run: gh pr merge "$PR_URL" --auto --merge --match-head-commit "$PR_HEAD_SHA"
